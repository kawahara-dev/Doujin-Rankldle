name: DLsite Ranking Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run DLsite ranking probe
        id: probe
        continue-on-error: true
        run: >-
          python scripts/dlsite_ranking_probe.py
          --url https://www.dlsite.com/maniax/ranking
          --check-robots
          --output tmp/dlsite_probe_result.json

      - name: Upload probe result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dlsite-probe-result
          path: tmp/dlsite_probe_result.json
          if-no-files-found: warn

      - name: Report probe failure
        if: ${{ steps.probe.outcome == 'failure' }}
        run: exit 1
