name: Collect FANZA products

on:
  push:
    branches:
      - main
    paths:
      - "data/import/fanza.json"
  schedule:
    # 03:17 / 09:17 / 14:17 / 22:17 JST
    - cron: "17 0,5,13,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ranking-data-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run tests and syntax checks
        run: |
          python -m pytest -q
          python -m py_compile src/*.py src/providers/*.py scripts/*.py
          node --check docs/app.js
      - name: Collect products
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID }}
          PUBLIC_WATCH_ENABLED: ${{ vars.PUBLIC_WATCH_ENABLED }}
        run: python -m src.collector
      - name: Sync data for GitHub Pages
        run: cp -R data/. docs/data/
      - name: Commit updated data
        run: |
          if git diff --quiet -- data docs/data; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git commit -m "chore: update FANZA product data"
          git push
