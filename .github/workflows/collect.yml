name: Collect FANZA products

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fanza-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests and syntax checks
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile src/collector.py tests/test_collector.py
          node --check docs/app.js
      - name: Collect products
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID }}
        run: python src/collector.py
      - name: Sync data for GitHub Pages
        run: cp data/*.json docs/data/
      - name: Commit updated data
        run: |
          if git diff --quiet -- data docs/data; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git commit -m "chore: update FANZA product data"
          git push
