name: Collect DLsite ranking

on:
  schedule:
    # 03:40 / 09:40 / 15:40 / 21:40 JST
    - cron: "40 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ranking-data-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect one public ranking page
        run: python -m src.dlsite_collector
      - name: Commit updated data
        run: |
          git add data/dlsite docs/data/dlsite
          if git diff --cached --quiet; then
            echo "No DLsite data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update DLsite ranking snapshot"
          git pull --rebase
          git push
