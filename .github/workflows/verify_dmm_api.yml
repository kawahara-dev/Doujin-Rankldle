name: Verify DMM API ranking

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Verify DMM API ranking
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID }}
        run: python -m src.verify_dmm_api
      - name: Ensure production data is unchanged
        run: git diff --exit-code -- . ':(exclude)data/verify/dmm_api_latest.json'
      - name: Upload verification result
        uses: actions/upload-artifact@v4
        with:
          name: dmm-api-verification
          path: data/verify/dmm_api_latest.json
          if-no-files-found: error
