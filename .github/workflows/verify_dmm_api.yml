name: Verify DMM API ranking

on:
  workflow_dispatch:
    inputs:
      verify_ranking:
        description: "Run ranking verification after inspecting the available floor codes"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: STEP 1 - Inspect DMM floors
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID }}
        run: python -m src.inspect_dmm_floors
      - name: STEP 2 - Verify DMM ranking
        if: ${{ inputs.verify_ranking }}
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID }}
        run: python -m src.verify_dmm_api
      - name: Ensure production data is unchanged
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only HEAD -- . ':(exclude)data/verify/**')
          if (( ${#changed[@]} )); then
            echo "::error::Tracked production files were modified outside data/verify/:"
            printf '  - %s\n' "${changed[@]}"
            exit 1
          fi
          echo "No tracked files outside data/verify/ were modified."
      - name: Upload floor inspection result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dmm-api-verification
          path: |
            data/verify/dmm_floors.json
            data/verify/dmm_api_latest.json
          if-no-files-found: warn
